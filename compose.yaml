services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: example-service:local
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    restart: unless-stopped

  whoami:
    image: traefik/whoami:v1.10.3
    ports:
      - "127.0.0.1:8081:80"
    restart: unless-stopped

  echo:
    image: hashicorp/http-echo:1.0.0
    command: ["-text=hello from the echo service"]
    ports:
      - "127.0.0.1:8082:5678"
    restart: unless-stopped